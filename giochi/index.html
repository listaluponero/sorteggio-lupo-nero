<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupo Runner</title>
    <link rel="stylesheet" href="gioco.css">
    <style>
        body { 
            background-color: #090b14; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        #loadingScreen { text-align: center; }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-left-color: #168b87; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 10px auto; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #gameArea { display: none; text-align: center; width: 100%; max-width: 850px; padding: 10px; box-sizing: border-box; }
        
        .header-ui {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        canvas {
            border: 2px solid #168b87;
            width: 100%;
            height: auto;
            max-height: 400px;
            background: #000;
            box-shadow: 0 0 20px rgba(22, 139, 135, 0.3);
        }

        .controls-ui {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #168b87;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #116b67; }
        .btn:disabled { background-color: #444; cursor: not-allowed; }

        /* Stili Classifica */
        .leaderboard-container {
            margin-top: 20px;
            background: rgba(25, 25, 35, 0.9);
            border: 1px solid #168b87;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        .leaderboard-container h3 { margin-top: 0; color: #168b87; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: #168b87; }
    </style>
</head>
<body>

    <!-- Schermata di Caricamento -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Caricamento modelli del lupo...</p>
    </div>

    <!-- Area di Gioco -->
    <div id="gameArea">
        <div class="header-ui">
            <span>PUNTI: <span id="score">0</span></span>
            <span>RECORD: <span id="personalBest">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls-ui">
            <button id="startGame" class="btn">INIZIA PARTITA</button>
            <button id="jumpGame" class="btn" disabled>SALTA (Spazio)</button>
            <button id="pauseGame" class="btn" disabled>PAUSA</button>
            <button id="fullscreenBtn" class="btn">SCHERMO INTERO</button>
        </div>

        <!-- Sezione Classifica -->
        <div class="leaderboard-container">
            <h3>CLASSIFICA TOP 5</h3>
            <table id="leaderboardTable">
                <thead>
                    <tr><th>Pos</th><th>Nome</th><th>Punti</th></tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Inserito dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="gioco.js"></script>
</body>
</html>
