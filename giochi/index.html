
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090909">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lupo Runner | Lupo Games</title>
    <link rel="stylesheet" href="gioco.css">
    <script src="gioco.js" defer></script>
</head>
<body>
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Caricamento modelli del lupo...</p>
    </div>

    <main id="gameArea">
        <div id="fullscreenGame">
            <div class="game-header-ui">
                <div class="score-box">
                    <span>PUNTI</span>
                    <strong id="score">0</strong>
                </div>
                <div class="score-box">
                    <span>RECORD</span>
                    <strong id="personalBest">0</strong>
                </div>
            </div>

            <div class="game-title">
                <h1>LUPO RUNNER</h1>
                <p>Corri. Salta. Sopravvivi.</p>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="gameCanvas" width="800" height="400"
                    aria-label="Lupo Runner" tabindex="0"></canvas>
            </div>

            <div id="gameMessage" aria-live="polite">
                Premi INIZIA PARTITA per cominciare
            </div>

            <div class="game-controls">
                <button id="startGame" class="btn btn-start" type="button">INIZIA PARTITA</button>
                <button id="jumpGame" class="btn btn-jump" type="button" disabled>SALTA</button>
                <button id="pauseGame" class="btn btn-pause" type="button" disabled>PAUSA</button>
                <button id="fullscreenBtn" class="btn btn-fullscreen" type="button">ESPANDI GIOCO</button>
                <button id="backToList" class="btn btn-back" type="button">← TORNA ALLA LISTA</button>
            </div>
        </div>

        <section class="leaderboard-container" id="leaderboard">
            <div class="leaderboard-header">
                <h2>CLASSIFICA TOP 5</h2>
                <button id="refreshBoard" class="refresh-btn" type="button">AGGIORNA</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Pos</th><th>Nome</th><th>Punti</th></tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3">Caricamento...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="leaderboardStatus"></div>
        </section>
    </main>

    <footer class="game-footer">Lupo Games</footer>
</body>
</html>
