<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupo Games — Lista Lupo Nero</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1112;
      color: #e0f2fe;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      color: #35d6cc;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p { color: #94a3b8; margin-bottom: 30px; text-align: center; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 600px;
    }
    .game-card {
      background: #152225;
      border: 2px solid #168b87;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: #35d6cc;
    }
    .game-card h2 { font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
    .game-card p { font-size: 0.9rem; margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>🐺 LUPO GAMES</h1>
  <p>Scegli il minigioco a cui vuoi giocare</p>

  <div class="games-grid">
    <a href="lupo-runner/index.html" class="game-card">
      <h2>LUPO RUNNER</h2>
      <p>Corsa ad ostacoli nel territorio del branco.</p>
    </a>
  </div>
</body>
</html>
