<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupo Runner</title>
    <link rel="stylesheet" href="gioco.css">
    <style>
        body { 
            background-color: #090b14; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #loadingScreen { text-align: center; }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-left-color: #168b87; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 10px auto; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #gameArea { display: none; text-align: center; }
    </style>
</head>
<body>

    <!-- Schermata di Caricamento per evitare schermate nere -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Caricamento modelli del lupo...</p>
    </div>

    <!-- Area di Gioco -->
    <div id="gameArea">
        <div class="header-ui" style="margin-bottom: 10px; font-size: 18px; font-weight: bold;">
            <span>PUNTI: <span id="score">0</span></span> | 
            <span>RECORD: <span id="personalBest">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400" style="border: 2px solid #168b87; max-width: 100%; height: auto;"></canvas>
        
        <div class="controls-ui" style="margin-top: 15px;">
            <button id="startGame" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">INIZIA PARTITA</button>
            <button id="jumpGame" style="padding: 10px 20px; font-size: 16px; cursor: pointer;" disabled>SALTA (Spazio)</button>
            <button id="pauseGame" style="padding: 10px 20px; font-size: 16px; cursor: pointer;" disabled>PAUSA</button>
        </div>
    </div>

    <script src="gioco.js"></script>
</body>
</html>
