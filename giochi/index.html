<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lupo Runner</title>
    <link rel="stylesheet" href="gioco.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #090b14; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px;
            touch-action: manipulation;
        }
        #loadingScreen { text-align: center; }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); 
            border-left-color: #168b87; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 10px auto; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #gameArea { 
            display: none; 
            text-align: center; 
            width: 100%; 
            max-width: 900px;
        }
        
        /* Modalità a tutto schermo fluida (senza distorsione) */
        #gameArea.fullscreen-mode {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            max-width: none;
            z-index: 9999;
            background: #090b14;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .header-ui {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        canvas {
            border: 2px solid #168b87;
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain; /* Impedisce che l'immagine si schiacci! */
            background: #000;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(22, 139, 135, 0.3);
        }

        .controls-ui {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #168b87;
            color: white;
            border: none;
            border-radius: 6px;
            user-select: none;
        }
        .btn:hover { background-color: #116b67; }
        .btn:disabled { background-color: #333; color: #777; cursor: not-allowed; }

        .leaderboard-container {
            margin-top: 15px;
            background: rgba(25, 25, 35, 0.9);
            border: 1px solid #168b87;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #gameArea.fullscreen-mode .leaderboard-container { display: none; } /* Nasconde la classifica in full screen per dare spazio al gioco */
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 6px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; }
        th { color: #168b87; }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Caricamento modelli del lupo...</p>
    </div>

    <div id="gameArea">
        <div class="header-ui">
            <span>PUNTI: <span id="score">0</span></span>
            <span>RECORD: <span id="personalBest">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="controls-ui">
            <button id="startGame" class="btn">INIZIA PARTITA</button>
            <button id="jumpGame" class="btn" disabled>SALTA (Spazio/Tappa)</button>
            <button id="pauseGame" class="btn" disabled>PAUSA</button>
            <button id="fullscreenBtn" class="btn">ESPANDI GIOCO</button>
        </div>

        <div class="leaderboard-container">
            <h3 style="margin: 0 0 10px 0; color: #168b87; font-size: 16px;">CLASSIFICA TOP 5</h3>
            <table>
                <thead>
                    <tr><th>Pos</th><th>Nome</th><th>Punti</th></tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <script src="gioco.js"></script>
</body>
</html>
