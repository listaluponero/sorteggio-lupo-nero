
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Sorteggio | Lista Lupo Nero</title>

  <style>
    :root {
      --bg: #090909;
      --panel: #151515;
      --panel-light: #202020;
      --text: #f4f4f4;
      --muted: #aaa;
      --red: #b71925;
      --red-light: #e52b38;
      --border: #333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, #211012 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 60px #0009;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--red-light);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 38px);
      text-align: center;
      letter-spacing: 1px;
    }

    .description {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 13px 14px;
      border: 1px solid #444;
      border-radius: 9px;
      outline: none;
      background: #0d0d0d;
      color: var(--text);
      font-size: 16px;
    }

    input:focus {
      border-color: var(--red-light);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--red);
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }

    button:hover:not(:disabled) {
      background: var(--red-light);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-light);
      text-align: center;
    }

    .status-title {
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #timer {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #0d0d0d;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #message:empty {
      display: none;
    }

    .notice {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 23px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <p class="eyebrow">Lista Lupo Nero</p>
    <h1>IL SORTEGGIO</h1>

    <p class="description">
      Inserisci il tuo nickname Instagram e prova la fortuna.
      Puoi effettuare un tentativo ogni 8 ore.
    </p>

    <form id="raffleForm">
      <label for="nickname">Nickname Instagram</label>
      <input
        id="nickname"
        name="nickname"
        type="text"
        maxlength="30"
        autocomplete="username"
        placeholder="@tuonickname"
        required
      >

      <button id="drawButton" type="submit" disabled>
        VERIFICA IN CORSO...
      </button>
    </form>

    <section class="status" aria-live="polite">
      <div class="status-title">Prossimo tentativo disponibile</div>
      <div id="timer">Verifica...</div>
    </section>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="notice">
      Il limite viene verificato dal server. I tentativi persi
      consumano comunque il periodo di attesa di 8 ore.
    </p>
  </main>

  <script>
    "use strict";

    const SHEET_URL =
      "https://script.google.com/macros/s/AKfycbxJDQfddop9mB3vX_nNjAMDSWBs4T4D1xYbOWvECZe88nfQMeaFAuHIgQ3O3jhwsC_9/exec";

    const COOLDOWN = 8 * 60 * 60 * 1000;
    const DEVICE_STORAGE_KEY = "lupoDeviceId";
    const NICKNAME_STORAGE_KEY = "lupoNickname";

    const nicknameInput = document.getElementById("nickname");
    const drawButton = document.getElementById("drawButton");
    const timerElement = document.getElementById("timer");
    const messageElement = document.getElementById("message");
    const raffleForm = document.getElementById("raffleForm");

    let nextAllowedAt = 0;
    let busy = false;
    let checkingStatus = false;
    let statusRequestId = 0;
    let statusTimer = null;

    function createDeviceId() {
      if (window.crypto && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }

      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getDeviceId() {
      let deviceId = "";

      try {
        deviceId = localStorage.getItem(DEVICE_STORAGE_KEY) || "";

        if (!/^[a-f0-9-]{30,50}$/i.test(deviceId)) {
          deviceId = createDeviceId();
          localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
        }
      } catch (error) {
        // Se localStorage è bloccato, non consentiamo di procedere
        // senza un identificativo persistente.
        throw new Error(
          "Impossibile salvare l'identificativo del dispositivo. " +
          "Abilita i dati del sito e ricarica la pagina."
        );
      }

      return deviceId;
    }

    function normalizeNickname(value) {
      return String(value || "")
        .trim()
        .replace(/^@+/, "")
        .slice(0, 30);
    }

    function showMessage(text) {
      messageElement.textContent = text || "";
    }

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
      ].join(":");
    }

    function renderTimer() {
      const remaining = Math.max(0, nextAllowedAt - Date.now());

      timerElement.textContent = remaining > 0
        ? formatTime(remaining)
        : (checkingStatus ? "Verifica..." : "Disponibile");

      drawButton.disabled =
        busy ||
        checkingStatus ||
        !normalizeNickname(nicknameInput.value) ||
        remaining > 0;

      if (!busy && !checkingStatus && remaining > 0) {
        drawButton.textContent = "TENTATIVO BLOCCATO";
      } else if (!busy && !checkingStatus) {
        drawButton.textContent = "PROVA LA FORTUNA";
      }
    }

    function requestServer(action, nickname) {
      return new Promise((resolve, reject) => {
        let deviceId;

        try {
          deviceId = getDeviceId();
        } catch (error) {
          reject(error);
          return;
        }

        const callbackName =
          "lupoCallback_" +
          Date.now() + "_" +
          Math.random().toString(36).slice(2);

        const params = new URLSearchParams({
          action,
          nickname,
          deviceId,
          callback: callbackName,
          _: String(Date.now())
        });

        const script = document.createElement("script");
        let completed = false;

        const timeout = setTimeout(() => {
          finish(new Error(
            "Connessione non riuscita. Controlla la connessione e riprova."
          ));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          script.remove();

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }
        }

        function finish(error, data) {
          if (completed) return;
          completed = true;
          cleanup();

          if (error) {
            reject(error);
          } else {
            resolve(data);
          }
        }

        window[callbackName] = data => {
          finish(null, data);
        };

        script.onerror = () => {
          finish(new Error(
            "Connessione non riuscita. Riprova più tardi."
          ));
        };

        script.src = SHEET_URL + "?" + params.toString();
        document.head.appendChild(script);
      });
    }

    async function checkCooldown() {
      const nickname = normalizeNickname(nicknameInput.value);
      const requestId = ++statusRequestId;

      if (!nickname) {
        nextAllowedAt = 0;
        checkingStatus = false;
        renderTimer();
        return;
      }

      checkingStatus = true;
      renderTimer();

      try {
        const data = await requestServer("status", nickname);

        if (requestId !== statusRequestId) return;

        if (!data || !data.success) {
          throw new Error(
            data && data.message
              ? data.message
              : "Non è stato possibile verificare il tentativo."
          );
        }

        const remaining = Math.max(0, Number(data.remainingMs) || 0);
        nextAllowedAt = Date.now() + remaining;

        if (remaining > 0) {
          showMessage(
            "Tentativo non disponibile. Potrai riprovare tra " +
            formatTime(remaining) + "."
          );
        } else {
          showMessage("");
        }
      } catch (error) {
        if (requestId !== statusRequestId) return;

        // In caso di errore non autorizziamo il tentativo.
        nextAllowedAt = Date.now() + 1000;
        showMessage(error.message || "Errore durante la verifica.");
      } finally {
        if (requestId === statusRequestId) {
          checkingStatus = false;
          renderTimer();
        }
      }
    }

    nicknameInput.addEventListener("input", () => {
      try {
        localStorage.setItem(
          NICKNAME_STORAGE_KEY,
          normalizeNickname(nicknameInput.value)
        );
      } catch (error) {
        // Il nickname non è una protezione di sicurezza.
      }

      showMessage("");
      clearTimeout(statusTimer);

      // Non considerare libero il sorteggio solo perché cambia il nome.
      checkingStatus = true;
      renderTimer();

      statusTimer = setTimeout(() => {
        checkCooldown();
      }, 400);
    });

    raffleForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (busy || checkingStatus) return;

      const nickname = normalizeNickname(nicknameInput.value);

      if (!nickname) {
        showMessage("Inserisci il nickname Instagram.");
        nicknameInput.focus();
        return;
      }

      if (Date.now() < nextAllowedAt) {
        renderTimer();
        showMessage(
          "Hai già effettuato un tentativo. Attendi la fine del blocco."
        );
        return;
      }

      busy = true;
      drawButton.disabled = true;
      drawButton.textContent = "ESTRAZIONE IN CORSO...";
      nicknameInput.disabled = true;
      showMessage("Verifica del tentativo in corso...");

      try {
        try {
          localStorage.setItem(NICKNAME_STORAGE_KEY, nickname);
        } catch (error) {
          // Il controllo reale è sul server.
        }

        const data = await requestServer("attempt", nickname);

        if (!data || !data.success) {
          throw new Error(
            data && data.message
              ? data.message
              : "Non è stato possibile completare il sorteggio."
          );
        }

        if (data.allowed === false && data.code === "COOLDOWN") {
          nextAllowedAt = Date.now() +
            Math.max(0, Number(data.remainingMs) || COOLDOWN);

          showMessage(
            "Tentativo bloccato. Potrai riprovare tra " +
            formatTime(nextAllowedAt - Date.now()) + "."
          );
          return;
        }

        if (data.allowed !== true) {
          throw new Error("Risposta del server non valida.");
        }

        nextAllowedAt = Date.now() +
          Math.max(0, Number(data.remainingMs) || COOLDOWN);

        if (data.won) {
          showMessage(
            "COMPLIMENTI! Hai vinto: " + data.prize +
            (data.code ? " — Codice premio: LN-" + data.code : "") +
            ". Conserva il codice e contatta la Lista per il ritiro."
          );
        } else {
          showMessage(
            "Questa volta non hai vinto. Il prossimo tentativo sarà " +
            "disponibile tra 8 ore."
          );
        }
      } catch (error) {
        showMessage(
          (error.message || "Errore temporaneo.") +
          " Se il risultato non è chiaro, verifica il registro prima " +
          "di riprovare: il server potrebbe aver già registrato il tentativo."
        );
      } finally {
        busy = false;
        nicknameInput.disabled = false;
        renderTimer();
      }
    });

    function startTimer() {
      setInterval(renderTimer, 1000);
    }

    function initialize() {
      try {
        getDeviceId();
      } catch (error) {
        showMessage(error.message);
        timerElement.textContent = "Verifica necessaria";
        drawButton.disabled = true;
        return;
      }

      try {
        const savedNickname =
          localStorage.getItem(NICKNAME_STORAGE_KEY) || "";

        if (savedNickname) {
          nicknameInput.value = savedNickname;
        }
      } catch (error) {
        // L'utente può inserire il nickname manualmente.
      }

      startTimer();

      if (normalizeNickname(nicknameInput.value)) {
        checkCooldown();
      } else {
        checkingStatus = false;
        renderTimer();
      }
    }

    initialize();
  </script>
</body>
</html>
